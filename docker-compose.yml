# Local stack: PostgreSQL + Atlas migrations + Redis + RabbitMQ + RustFS (S3) + app.
# Redis and RabbitMQ are optional: the app starts them only when their DSNs
# are configured. The migrate service waits for a healthy database; the app
# waits for the migration plus healthy brokers before starting the API,
# dispatcher, and broker consumers. RustFS backs the s3fetch example custom
# node (see pkg/customnode/s3fetch/README.md).
#
# The stack is API-only: there is no bundled web UI. Deploy a frontend
# separately against http://localhost:8080; CORS allows any origin by
# default, or set BEELINEWF_INFRA_HTTP_CORS_ALLOWED_ORIGINS on the app
# service below to restrict it.
#
#   docker compose up --build
#   curl http://localhost:8080/health/ready
#   Swagger UI: http://localhost:8080/swagger/index.html
#   RabbitMQ management UI: http://localhost:15672 (beelinewf/beelinewf)
#   RustFS console: http://localhost:9001 (rustfsadmin/rustfsadmin)

services:
  db:
    image: postgres:18-alpine@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5
    environment:
      POSTGRES_USER: gorm
      POSTGRES_PASSWORD: gorm
      POSTGRES_DB: gorm
    ports:
      - "9921:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gorm -d gorm"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      # Postgres 18+ stores data in a major-version-specific subdirectory
      # and requires the mount at the parent path. Upgrading from the old
      # postgres:16 stack needs a fresh volume (docker compose down -v);
      # pg_upgrade across the major version is out of scope for local dev.
      - pgdata:/var/lib/postgresql

  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    ports:
      - "26379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - redisdata:/data

  rabbitmq:
    image: rabbitmq:4-management-alpine@sha256:3ef7f7e89fed709a78f79b8b5f4e30e1312a1d4089da752e23595566d9d61a95
    environment:
      # Local-development credentials; change for anything beyond local use.
      RABBITMQ_DEFAULT_USER: beelinewf
      RABBITMQ_DEFAULT_PASS: beelinewf
    ports:
      - "25672:5672"
      - "25673:15672"
    healthcheck:
      test: ["CMD", "su-exec", "rabbitmq", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq

  migrate:
    image: arigaio/atlas:1.3.0@sha256:aa51fd9b86d27a4dde60e51e4ceeaf5b8080b5b37b94c6c591cd9f9526a32dc1
    command:
      - migrate
      - apply
      - --url
      - postgres://gorm:gorm@db:5432/gorm?sslmode=disable
      - --dir
      - file:///migrations/versions
    volumes:
      - ./migrations:/migrations:ro
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # RustFS volume permissions fixer: the RustFS image runs as 10001:10001,
  # so the named volumes need that ownership before the server starts.
  rustfs-permission-helper:
    image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
    volumes:
      - rustfs_data_0:/data0
      - rustfs_data_1:/data1
      - rustfs_data_2:/data2
      - rustfs_data_3:/data3
      - rustfs_logs:/logs
    command: >
      sh -c "
      chown -R 10001:10001 /data0 /data1 /data2 /data3 /logs &&
      echo 'Volume permissions fixed' &&
      exit 0
      "
    restart: "no"

  # S3-compatible object storage backing the s3fetch example custom node.
  # Single node, 4 local drives (erasure layout needs >= 4 paths), plain
  # HTTP for local dev. s3fetch renders connection fields from
  # {{ env.BEELINEWF_S3_* }}, set on the app service below.
  rustfs:
    image: rustfs/rustfs:latest@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
    depends_on:
      - rustfs-permission-helper
    security_opt:
      - "no-new-privileges:true"
    ports:
      - "29000:9000" # S3 API
      - "29001:9001" # console
    environment:
      - RUSTFS_VOLUMES=/data/rustfs{0...3}
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
      - RUSTFS_CONSOLE_ENABLE=true
      # Local-development credentials; change for anything beyond local use.
      - RUSTFS_ACCESS_KEY=rustfsadmin # CHANGEME
      - RUSTFS_SECRET_KEY=rustfsadmin # CHANGEME
      - RUSTFS_OBS_LOGGER_LEVEL=info
      - RUSTFS_OBS_LOG_DIRECTORY=/app/logs
      # Local dev only: all four paths sit on same Docker disk, so RustFS
      # erasure disk check fails without this. Never enable beyond local testing.
      - RUSTFS_UNSAFE_BYPASS_DISK_CHECK=true
    volumes:
      - rustfs_data_0:/data/rustfs0
      - rustfs_data_1:/data/rustfs1
      - rustfs_data_2:/data/rustfs2
      - rustfs_data_3:/data/rustfs3
      - rustfs_logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-ec", "curl -fsS http://127.0.0.1:9000/health && curl -fsS http://127.0.0.1:9001/rustfs/console/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Mock OIDC provider for local OIDC-mode testing (see
  # scripts/mock_oidc_provider.py). The app discovers it at
  # http://mock-oidc:9099 over compose DNS; fetch pre-minted tokens from the
  # host at http://localhost:9099/token/manager (also: admin, auditor,
  # finance, noroles).
  # Local testing only: /token/<who> mints a JWT for anyone who asks.
  mock-oidc:
    build:
      context: .
      dockerfile: Dockerfile.mock-oidc
    ports:
      - "9099:9099"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9099/.well-known/openid-configuration"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    environment:
      BEELINEWF_INFRA_HTTP_HOST: 0.0.0.0:8080
      # CORS origin allowlist for a separately deployed browser frontend.
      # "*" allows any origin (the development default); set explicit
      # origins to restrict. Comma-separated; never "*" with credentials.
      BEELINEWF_INFRA_HTTP_CORS_ALLOWED_ORIGINS: "${BEELINEWF_INFRA_HTTP_CORS_ALLOWED_ORIGINS:-*}"
      BEELINEWF_INFRA_POSTGRESQL_DSN: host=db user=gorm password=gorm dbname=gorm port=5432 sslmode=disable
      BEELINEWF_INFRA_REDIS_DSN: redis://redis:6379/0
      BEELINEWF_INFRA_RABBITMQ_DSN: amqp://beelinewf:beelinewf@rabbitmq:5672/
      BEELINEWF_INFRA_RABBITMQ_INPUT_QUEUE: beelinewf.input
      BEELINEWF_INFRA_RABBITMQ_OUTPUT_QUEUE: beelinewf.output
      BEELINEWF_INFRA_RABBITMQ_STATUS_QUEUE: beelinewf.status
      BEELINEWF_AUTH_ENABLED: "false"
      # Only consulted when BEELINEWF_AUTH_ENABLED is true; with authentication
      # off the token is ignored and every route is open, exactly as before.
      BEELINEWF_API_TOKEN: "wadidaw"
      # OIDC resource server. Off by default so the local stack starts with
      # no identity provider. To try a login, point BEELINEWF_AUTH_OIDC_ISSUER
      # at a reachable provider (Zitadel, Keycloak, Authentik, ...) and set
      # the client id it was registered with; the frontend then reads the
      # endpoints from GET /v1/auth/config and runs code+PKCE. The API is a
      # resource server only, so no client secret belongs here. For a
      # zero-setup provider, use the bundled mock-oidc service:
      # BEELINEWF_AUTH_OIDC_ISSUER=http://mock-oidc:9099,
      # BEELINEWF_AUTH_OIDC_CLIENT_ID=beelinewf.
      BEELINEWF_AUTH_OIDC_ENABLED: "${BEELINEWF_AUTH_OIDC_ENABLED:-true}"
      BEELINEWF_AUTH_OIDC_ISSUER: "${BEELINEWF_AUTH_OIDC_ISSUER:-http://mock-oidc:9099}"
      BEELINEWF_AUTH_OIDC_CLIENT_ID: "${BEELINEWF_AUTH_OIDC_CLIENT_ID:-beelinewf}"
      BEELINEWF_AUTH_OIDC_AUDIENCE: "${BEELINEWF_AUTH_OIDC_AUDIENCE:-}"
      BEELINEWF_AUTH_OIDC_ROLES_CLAIM: "${BEELINEWF_AUTH_OIDC_ROLES_CLAIM:-roles}"
      BEELINEWF_AUTH_OIDC_USERNAME_CLAIM: "${BEELINEWF_AUTH_OIDC_USERNAME_CLAIM:-name}"
      # Role catalog: mirrors config.yaml role_permissions so OIDC tokens
      # asserting the shipped roles grant the shipped permissions. A role a
      # token carries that is absent here grants nothing (deny by default).
      BEELINEWF_AUTH_ROLE_PERMISSIONS: >-
        {"admin": ["definitions:read", "definitions:write", "secrets:read", "secrets:write",
          "instances:create", "instances:read", "instances:update-context", "input:deliver",
          "instances:control", "instances:migrate", "statistics:read", "roles:read", "schedules:read", "schedules:write", "users:read"],
         "finance": ["instances:read", "input:deliver"],
         "auditor": ["definitions:read", "instances:read", "statistics:read", "roles:read"]}
      BEELINEWF_WORKER_POOL_SIZE: "50"
      # BEELINEWF_* is snapshotted per instance under {{ env.* }}, except the
      # denied credentials: BEELINEWF_API_TOKEN, BEELINEWF_AUTH_*, BEELINEWF_SYSTEM_*,
      # BEELINEWF_INFRA_*, and any BEELINEWF_*_DSN (the DSNs set just above). A denied name resolves
      # as "path not found". Extend or narrow with the patterns below, e.g.
      # BEELINEWF_ENGINE_ENV_DENY_EXTRA: "BEELINEWF_OPENROUTER_KEY".
      BEELINEWF_ENGINE_DEFAULT_NODE_TIMEOUT: 30s
      BEELINEWF_ENGINE_MAX_NODE_TIMEOUT: 5m
      BEELINEWF_ENGINE_CONDITION_TIMEOUT: 5s
      BEELINEWF_ENGINE_LEASE_DURATION: 30s
      BEELINEWF_ENGINE_CLAIM_BATCH_SIZE: "10"
      # Dev convenience: allow any outbound HTTP target (the engine logs a
      # warning). Remove or tighten for anything beyond local testing.
      BEELINEWF_ENGINE_HTTP_ALLOWLIST: "*"
      # OpenRouter key for openrouter and jev custom nodes. Replace locally;
      # instance creation snapshots BEELINEWF_* under {{ env.* }}.
      BEELINEWF_OPENROUTER_KEY: "${BEELINEWF_OPENROUTER_KEY:-}"
      BEELINEWF_SYSTEM_USER_ID: "00000000-0000-7000-8000-000000000001"
      BEELINEWF_SYSTEM_NAME: system
      BEELINEWF_SYSTEM_EMAIL: system@localhost
      # S3 connection for the s3fetch example custom node. Create snapshots
      # BEELINEWF_* into each instance context under {{ env.* }}, so s3fetch
      # configs use {{ env.BEELINEWF_S3_ENDPOINT }} etc. (see
      # pkg/customnode/s3fetch/README.md). rustfs runs plain HTTP locally,
      # so use_ssl=false configs match; console at localhost:9001.
      BEELINEWF_S3_ENDPOINT: rustfs:9000
      BEELINEWF_S3_ACCESS_KEY: rustfsadmin
      BEELINEWF_S3_SECRET_KEY: rustfsadmin
      # S3 connection for multipart input uploads (infra.storage). Input
      # nodes name only bucket/prefix/constraints; the endpoint and
      # credentials live here. Shares the local RustFS with s3fetch above.
      BEELINEWF_INFRA_STORAGE_ENDPOINT: rustfs:9000
      BEELINEWF_INFRA_STORAGE_REGION: us-east-1
      BEELINEWF_INFRA_STORAGE_USE_SSL: "false"
      BEELINEWF_INFRA_STORAGE_ACCESS_KEY: rustfsadmin
      BEELINEWF_INFRA_STORAGE_SECRET_KEY: rustfsadmin
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      mock-oidc:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  pgdata:
  redisdata:
  rabbitmqdata:
  rustfs_data_0:
  rustfs_data_1:
  rustfs_data_2:
  rustfs_data_3:
  rustfs_logs:
