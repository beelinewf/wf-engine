openapi: 3.1.0
info:
  title: BeelineWF Workflow Engine
  version: 1.0.0
  description: |
    Durable PostgreSQL-backed workflow engine. Definitions are immutable;
    new versions reference the previous version. Instances run asynchronously
    and expose status, context, input, and node-level debugging APIs, plus a
    live status stream over server-sent events.
    Lean-context mode stores per-node context as replayable set/unset diffs
    with periodic anchors. Fleet default: BEELINEWF_ENGINE_LEAN_CONTEXT_DEFAULT
    (also BEELINEWF_ENGINE_LEAN_ANCHOR_EVERY, BEELINEWF_ENGINE_LEAN_REPLAY_MAX).
servers:
  - url: /
tags:
  - name: Workflow Definitions
  - name: Node Definitions
  - name: Secrets
  - name: Workflow Instances
  - name: Controls
  - name: Node Debug
  - name: Health
  - name: Statistics
  - name: Auth
  - name: Roles
  - name: Users
  - name: Schedules
paths:
  /v1/auth/config:
    get:
      tags: [Auth]
      operationId: getAuthConfig
      summary: Get the login contract
      description: |
        Public by design: a frontend has to read this to learn where to log
        in, which is exactly when it holds no token yet. Reports whether OIDC
        is configured, the provider endpoints to run the flow against, the
        claim the roles are read from, whether the built-in local login
        (register/login, optional email verification) is on, and every role
        name the role catalog knows, so a role can be labelled before the
        caller has one.
      responses:
        "200":
          description: Login contract
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthConfig" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/auth/register:
    post:
      tags: [Auth]
      operationId: registerLocalUser
      summary: Register a local account
      description: |
        Public and rate limited (429 with Retry-After past the budget).
        With registration closed the route answers 403; with email
        verification on the account pends and the response carries no
        token, otherwise it is a login session at once. Either way the
        account is created, so the status is 201. A duplicate email is 409.
        The route exists only while local auth is enabled.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegisterResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/auth/login:
    post:
      tags: [Auth]
      operationId: loginLocalUser
      summary: Log in with email and password
      description: |
        Public and rate limited (429 with Retry-After past the budget).
        Unknown email, wrong password, and disabled account share one 401,
        so the endpoint cannot probe for accounts; a pending account is
        403. The route exists only while local auth is enabled.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Login session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/auth/verify-email:
    post:
      tags: [Auth]
      operationId: verifyEmail
      summary: Verify an email with its mailed token
      description: |
        Public and rate limited (429 with Retry-After past the budget). The
        token is single-use and expiring: unknown is 422, expired asks for
        a resend. Success returns a login session for the verified account.
        The route exists only while local auth is enabled.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerifyEmailRequest" }
      responses:
        "200":
          description: Login session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/auth/resend-verification:
    post:
      tags: [Auth]
      operationId: resendVerification
      summary: Resend a verification link
      description: |
        Public and rate limited (429 with Retry-After past the budget). The
        response is always the same generic success — unknown email,
        verified account, disabled account, and cooldown suppression
        included — so the endpoint cannot probe for accounts. The route
        exists only while local auth is enabled.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResendVerificationRequest" }
      responses:
        "200":
          description: Generic success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResendVerificationResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/auth/me:
    get:
      tags: [Auth]
      operationId: getAuthMe
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      summary: Get the authenticated caller
      description: |
        The identity behind the presented credential, plus the effective
        permissions the UI can act on. A caller must be known to ask who it
        is, so this route is authenticated but carries no resource-action
        gate: an authenticated caller is never refused here with 403.
        service is true for the API-token principal, which bypasses every
        authorization gate and reports the admin role with every known
        permission.
      responses:
        "200":
          description: The authenticated caller
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthMe" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/roles:
    get:
      tags: [Roles]
      operationId: listRoles
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      summary: List roles and their permissions
      description: |
        Served from the role tables, which are the source of truth every
        committed write refreshes the in-memory catalog from, so the
        response never advertises a permission the engine would not grant.
        Reads need roles:read; writes need roles:write.
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "200":
          description: Role catalog
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoleList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [Roles]
      operationId: createRole
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      summary: Create a role
      description: |
        Needs roles:write; the API token bypasses with no role grant. A
        blank name is 422 and a duplicate is 409. The created grants
        authorize immediately: the write refreshes the shared catalog the
        gates consult.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleCreate" }
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "201":
          description: Created role
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Role" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/roles/{name}:
    get:
      tags: [Roles]
      operationId: getRole
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      summary: Get one role and its permissions
      description: |
        A name that is blank once trimmed is 422 rather than 404: it names
        no role for any caller, so no lookup could ever succeed against it.
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "200":
          description: Role detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Role" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "500": { $ref: "#/components/responses/InternalError" }
    put:
      tags: [Roles]
      operationId: updateRole
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      summary: Replace a role's permissions
      description: |
        Needs roles:write; the API token bypasses with no role grant. Fully
        replaces the permission list: an empty list revokes every grant. An
        omitted description keeps the stored one. Stripping roles:write
        from the last holder is 409 and leaves the role unchanged: at least
        one role must always retain the roles:write permission.
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleUpdate" }
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "200":
          description: Updated role
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Role" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      tags: [Roles]
      operationId: deleteRole
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      summary: Delete a role
      description: |
        Needs roles:write; the API token bypasses with no role grant.
        Deleting the last roles:write holder is 409 and leaves the role
        unchanged: at least one role must always retain the roles:write
        permission. Tokens and input nodes naming a deleted role keep
        resolving the name, it simply grants nothing.
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/users:
    get:
      tags: [Users]
      operationId: listUsers
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      summary: List users, newest first
      description: |
        One page of the users table with the total matching row count. OIDC
        callers are created just in time when they first authenticate; local
        users arrive from registration or an admin. Reads need users:read.
        Filters combine with AND. The identity-cache metadata is never
        exposed: it is debug-only and not authorization data, and neither
        is the password hash.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - $ref: "#/components/parameters/UserOrder"
        - $ref: "#/components/parameters/UserIDs"
        - $ref: "#/components/parameters/UserRoles"
        - $ref: "#/components/parameters/UserIssuers"
        - $ref: "#/components/parameters/UserIsLocal"
        - $ref: "#/components/parameters/UserEmailVerified"
        - $ref: "#/components/parameters/UserIsActive"
        - $ref: "#/components/parameters/UserEmail"
        - $ref: "#/components/parameters/UserName"
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "200":
          description: One page of users
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [Users]
      operationId: createUser
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      summary: Create a local user
      description: |
        Admin-created accounts verify at write and activate at once. Writes
        need users:write. The response never carries the credential.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserCreate" }
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "201":
          description: User created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/users/{id}:
    get:
      tags: [Users]
      operationId: getUser
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      summary: Get one user
      description: |
        A malformed id is 422 rather than 404: it names no user for any
        caller, so no lookup could ever succeed against it. Subject and
        issuer are null for a user with no provider identity.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "200":
          description: User detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "500": { $ref: "#/components/responses/InternalError" }
    put:
      tags: [Users]
      operationId: updateUser
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      summary: Update a local user
      description: |
        A nil field keeps the stored value. A users:write holder edits every
        field; the account itself edits name, email, and password only,
        proving the current password for a rotation. An email change
        re-pends verification while it is on. OIDC rows are read-only here.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserUpdate" }
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "200":
          description: User detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      tags: [Users]
      operationId: disableUser
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      summary: Disable a local user
      description: |
        Soft-delete: the row survives for the audit trail, but the
        credential is cleared and the account can no longer authenticate;
        outstanding tokens stop resolving at once. Writes need users:write.
        The system user and the caller's own account refuse with 422.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "204": { description: Disabled }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/users/{id}/resend-verification:
    post:
      tags: [Users]
      operationId: resendUserVerification
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      summary: Resend a user's verification link
      description: |
        The admin variant of the public resend: unknown id is 404 and the
        cooldown does not apply, but a verified account is still a silent
        success. Writes need users:write.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "204": { description: Link sent (or account already verified) }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "500": { $ref: "#/components/responses/InternalError" }
  /health/live:
    get:
      tags: [Health]
      operationId: liveness
      summary: Liveness probe
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /health/ready:
    get:
      tags: [Health]
      operationId: readiness
      summary: Readiness probe (checks database)
      responses:
        "200":
          description: Ready to serve
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: Not ready (database unreachable)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /v1/secrets:
    post:
      tags: [Secrets]
      operationId: createSecret
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      summary: Create a secret
      description: Secret values are never returned. Responses contain a constant mask.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SecretRequest" }
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "201":
          description: Created; plaintext is omitted from the response
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Secret" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    get:
      tags: [Secrets]
      operationId: listSecrets
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      summary: List secrets with constant-masked values
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "200":
          description: List of masked secrets
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecretList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/secrets/{key}:
    get:
      tags: [Secrets]
      operationId: getSecret
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      summary: Get a secret with a constant-masked value
      parameters:
        - $ref: "#/components/parameters/SecretKey"
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "200":
          description: Masked secret
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Secret" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Secrets]
      operationId: updateSecret
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      summary: Replace a secret value; running instance snapshots remain unchanged
      parameters:
        - $ref: "#/components/parameters/SecretKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateSecretRequest" }
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "200":
          description: Updated secret
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Secret" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    delete:
      tags: [Secrets]
      operationId: deleteSecret
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      summary: Delete a secret; running instance snapshots remain unchanged
      parameters:
        - $ref: "#/components/parameters/SecretKey"
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/forms:
    post:
      tags: [Forms]
      operationId: createForm
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      summary: Create a form
      description: Stores a render contract for input nodes to reference by form_id.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveFormRequest" }
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "201":
          description: Created form
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Form" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    get:
      tags: [Forms]
      operationId: listForms
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      summary: List forms in creation order
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "200":
          description: List of forms
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FormList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/forms/{id}:
    get:
      tags: [Forms]
      operationId: getForm
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      summary: Get a form
      parameters:
        - $ref: "#/components/parameters/FormID"
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "200":
          description: One form
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Form" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Forms]
      operationId: updateForm
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      summary: Fully overwrite a form
      description: Overwrites name, schema, and ui; an omitted ui clears it. A form stays updatable while referenced.
      parameters:
        - $ref: "#/components/parameters/FormID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveFormRequest" }
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "200":
