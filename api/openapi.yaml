        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/workflow/instance/{id}/debug/context:
    get:
      tags: [Node Debug]
      operationId: getDebugContext
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      summary: Get debug-position context as TypeScript (autocomplete)
      description: |
        Debug instances only (`debug: false` answers 409). node_id omitted
        selects the debug cursor (falling back to the live redacted instance
        context when the cursor is empty or the node never ran); an explicit
        node_id accepts a graph node id or an occurrence id. attempt omitted
        returns the latest execution; a positive attempt selects an exact
        execution. occurrence_id/attempt are null when the position has no
        occurrence. The snapshot is secret-redacted before rendering, so
        typescript carries types but never literal values.
      parameters:
        - $ref: "#/components/parameters/InstanceID"
        - name: node_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: attempt
          in: query
          required: false
          schema: { type: integer, minimum: 1 }
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "200":
          description: Debug context detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DebugContext" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/workflow/instance/{id}/input:
    put:
      tags: [Workflow Instances]
      operationId: deliverInput
      # Deliberately empty: this route serves anonymous callers, so the
      # global requirement does not apply to it. A presented credential is
      # still verified, which is why 401 remains a documented response.
      security: []
      summary: Deliver input to a waiting input node
      description: |
        Raw JSON body, or multipart/form-data when the waiting input node
        lists it in accept (see pending_input.accept on the status view);
        requires Idempotency-Key header. Accepted payload is written to the
        waiting input node's output_property (bare key, defaults to node
        id). The validation script is the only backend gate: a payload
        violating the node's referenced form but passing the script is
        accepted, and a script failure returns 422 with the rejection
        message. Reusing an Idempotency-Key with a different payload returns
        409; retries must reuse the same key with the identical payload, and
        a corrected payload needs a fresh key. A multipart replay returns
        the stored delivery without re-uploading and without the
        payload-equality check.

        A multipart delivery streams file parts into object storage and the
        context receives only references. Every field lands as an array: a
        text field becomes an array of strings, a file field an array of
        {original_file_name, file_name, size, mime_type} objects, both in
        part order. A trailing [] on a field name is stripped and merges
        with the bare name. A part with a filename is a file, a part without
        one a string; mixing both under one field, or any other bracket
        form, returns 400. Files breaching the node's size or MIME
        constraints fail with 413 or 422, and every failure deletes the
        objects the request already uploaded.

        This is the only endpoint that serves an anonymous caller, and only
        when the waiting input node sets public: true. A request with no
        credential reaches this route unauthenticated and is admitted only on
        a public node; a private node answers 403. Because the status and
        forms-library reads stay authenticated, an anonymous caller has to
        learn the payload contract out-of-band, so share the instance id and
        the shape deliberately. A credential that is present but invalid is
        still 401,
        including on a public node: a caller that proved the wrong thing never
        degrades to an accepted anonymous delivery. An authenticated caller
        on a public node is authorized exactly as on a private one, and its
        delivery is attributed to it rather than marked anonymous.
      parameters:
        - $ref: "#/components/parameters/InstanceID"
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
        - name: branch_id
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: |
            Parallel branch holding the parked input node (omit for the
            instance cursor). Unknown branches return 404; a branch that is
            not parked on an input node, or a key already used for a
            different branch, returns 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: {}
          multipart/form-data:
            schema:
              type: object
              description: |
                File upload for nodes listing multipart/form-data in accept.
                A part with a filename is a file and streams into object
                storage; a part without one is a string. Every field lands in
                context as an array under the same output_property a JSON
                body would use.
              properties:
                files:
                  type: array
                  items: { type: string, format: binary }
                fields:
                  type: array
                  items: { type: string }
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "202":
          description: Accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InputDeliveryResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /v1/workflow/instance/{id}/pause:
