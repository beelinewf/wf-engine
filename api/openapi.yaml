      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      summary: Get workflow instance status
      parameters:
        - $ref: "#/components/parameters/InstanceID"
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "200":
          description: Instance status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstanceStatus" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/workflow/instance/{id}/status/stream:
    get:
      tags: [Workflow Instances]
      operationId: streamWorkflowStatus
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      summary: Stream workflow instance status
      description: |
        Live status over server-sent events. The server sends the current
        status promptly on connect, then a new `status` event only when the
        visible status changes; each event's data is the InstanceStatus
        schema, identical to GET .../{id}/status. Idle streams receive `: ping`
        comments, and the stream closes after a terminal status
        (finished, failed, stopped) is delivered, after 30 minutes, or when
        the client disconnects. A reconnect receives the current snapshot
        first, so a client may resume with Last-Event-ID without a replay
        log. Emissions are paced server-side at ~20 events/s at most.
        Failures before the first event use the error responses below; a
        mid-stream failure arrives as an `error` event and closes the stream.
      parameters:
        - $ref: "#/components/parameters/InstanceID"
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "200":
          description: Status event stream
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  SSE frames: `event: status` with InstanceStatus JSON in
                  data, `: ping` heartbeats, and a terminal `error` event
                  carrying a problem body when the stream fails mid-flight.
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/workflow/instance/{id}/context:
    get:
      tags: [Workflow Instances]
      operationId: getWorkflowContext
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      summary: Get workflow instance context
      parameters:
        - $ref: "#/components/parameters/InstanceID"
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "200":
          description: Instance context
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstanceContext" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [Workflow Instances]
      operationId: replaceWorkflowContext
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      summary: Replace workflow instance context (paused instances only)
      description: |
        Replaces the full context of a paused instance. The body must be a
        JSON object; keys not present in the body are dropped (full
        replacement, not a merge). The update is guarded atomically: it
        succeeds only while the instance is paused, so a concurrent resume
        or stop wins and the request returns 409. An optional
        X-Context-Update-Reason header is recorded on the context_updated
        audit event; context values are never written to the audit trail.
      parameters:
        - $ref: "#/components/parameters/InstanceID"
        - name: X-Context-Update-Reason
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "200":
          description: Replaced instance context
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstanceContext" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /v1/workflow/instance/{id}/status/node/{node_id}:
    get:
      tags: [Node Debug]
      operationId: getNodeDebug
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      summary: Get node occurrence debug detail (context snapshots, attempts)
      description: |
        node_id is the occurrence UUIDv7. attempt omitted returns the latest
        execution; a positive attempt selects an exact loop execution. A valid
        node that has not run returns 200 with status not_started.
      parameters:
        - $ref: "#/components/parameters/InstanceID"
