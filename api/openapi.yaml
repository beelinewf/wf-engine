        - ApiKeyAuth: []
        - BearerAuth: []
      summary: Roll back a paused or failed instance to a prior node occurrence
      description: |
        Moves the cursor of a paused or failed instance back to an
        already-executed node occurrence (the occurrence UUID from the node
        debug API), so the next resume re-executes forward from there. The
        instance is always paused afterwards (failed becomes paused); its
        context is restored from the target occurrence's context_before
        snapshot. Rolling back onto the currently parked input occurrence is
        a no-op success (200, still paused, no writes). Rolling back to any
        other occurrence supersedes (closes) the live parked attempt
        atomically in the same transaction: the park moves to stopped and
        cancelled with the error "superseded by rollback", and the closed
        attempt's ids ride on the rollback audit event. History is otherwise
        immutable: node occurrences, input deliveries,
        and prior events are untouched, and the next execution increments
        the target occurrence's attempt. Nodes that never ran, group nodes,
        and occurrences with no restorable context are rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RollbackRequest" }
      parameters:
        - $ref: "#/components/parameters/InstanceID"
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "200":
          description: Rolled back (always paused)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RollbackResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /v1/workflow/instance/{id}/migrate:
    post:
      tags: [Controls]
      operationId: migrateWorkflow
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      summary: Migrate a paused, failed, or input-parked instance to a newer definition
      description: |
        Starts a fresh run on a newer definition of the same lineage at a
        caller-supplied start node, carrying the source's context over
        (context_patch deep-merged, fresh env/secret snapshots applied
        last), and stops the source atomically in the same transaction. The
        runs link both ways (migrated_from/superseded_by, visible on the
        status view); history is not copied. The start node must sit in the
        target graph outside any parallel region's interior. The
        replacement starts paused by default for inspect-fix-resume. No
        idempotency key in v1: on timeout, retry (409) and read the new id
        from the source's superseded_by.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MigrateRequest" }
      parameters:
        - $ref: "#/components/parameters/InstanceID"
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "201":
          description: Migrated (replacement created, source stopped)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MigrateResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /v1/workflow/schedules:
    post:
      tags: [Schedules]
      operationId: createCronSchedule
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      summary: Create a cron schedule that starts instances on every tick
      description: |
        Persists a crontab expression bound to a workflow definition. While
        the schedule is enabled, the engine creates an instance of that
        definition with the stored context on every tick; the instance runs
        asynchronously through the normal dispatcher. Ticks are evaluated in
        the schedule's timezone. A schedule referencing a definition blocks
        that definition's deletion until the schedule is removed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CronScheduleRequest" }
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CronSchedule" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    get:
      tags: [Schedules]
      operationId: listCronSchedules
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      summary: List cron schedules
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "200":
          description: List of cron schedules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CronScheduleList"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/workflow/schedules/{id}:
    get:
      tags: [Schedules]
      operationId: getCronSchedule
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      summary: Get a cron schedule by id
      parameters:
        - $ref: "#/components/parameters/ScheduleID"
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "200":
          description: Cron schedule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CronSchedule" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [Schedules]
      operationId: deleteCronSchedule
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      summary: Delete a cron schedule (ticks stop; running instances are unaffected)
      parameters:
        - $ref: "#/components/parameters/ScheduleID"
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/workflow/schedules/{id}/pause:
    post:
      tags: [Schedules]
      operationId: pauseCronSchedule
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      summary: Pause a cron schedule (idempotent)
      parameters:
        - $ref: "#/components/parameters/ScheduleID"
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "200":
          description: Paused
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CronSchedule" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/workflow/schedules/{id}/resume:
    post:
      tags: [Schedules]
      operationId: resumeCronSchedule
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      summary: Resume a paused cron schedule (idempotent)
      parameters:
        - $ref: "#/components/parameters/ScheduleID"
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "200":
          description: Resumed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CronSchedule" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Token
      description: API token authentication. Required when auth is enabled; sent as X-Api-Token header. Authenticates as the service principal, which bypasses every authorization gate. Failed presentations are throttled per client IP (auth.rate_limit): past the configured threshold further attempts answer 429 with a Retry-After until the block expires.
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Bearer authentication: either an OIDC JWT or a locally issued one. For OIDC the
        engine is a resource server: the frontend completes a code+PKCE flow
        against the provider and calls the API with the resulting JWT. For
        local auth the frontend logs in over POST /v1/auth/login and calls
        the API with the returned JWT. Which logins exist is served by
        GET /v1/auth/config.
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage:
      name: per_page
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Order:
      name: order
      in: query
      required: false
      schema:
        type: string
        description: Sort field with optional leading "-" for descending (allowlisted)
    ID:
      name: id
      in: query
      required: false
      schema:
        type: array
        items: { type: string, format: uuid }
        maxItems: 100
        description: Repeatable id filter
      style: form
      explode: true
    Name:
      name: name
      in: query
      required: false
      schema: { type: string }
    LineageID:
      name: lineage_id
      in: query
      required: false
      schema: { type: string, format: uuid }
    Version:
      name: version
      in: query
      required: false
      schema: { type: integer, minimum: 1 }
    LatestOnly:
      name: latest_only
      in: query
      required: false
      schema: { type: boolean }
    NodeType:
      name: type
      in: query
      required: false
      schema: { type: string }
    WorkflowDefinitionID:
      name: workflow_definition_id
      in: query
      required: false
      schema: { type: string, format: uuid }
    InstanceStatus:
      name: status
      in: query
      required: false
      schema:
        type: array
        items: { type: string, enum: [waiting, running, paused, finished, failed, stopped] }
        description: Repeatable status filter
      style: form
      explode: true
    Debug:
      name: debug
      in: query
      required: false
      schema: { type: boolean, description: "true: only step-through runs; false: only normal runs; omitted: both" }
    CreatedFrom:
      name: created_from
      in: query
      required: false
      schema:
        type: string
        format: date-time
        description: Inclusive window start (RFC3339) on instance creation time
    CreatedTo:
      name: created_to
      in: query
      required: false
      schema:
        type: string
        format: date-time
        description: Inclusive window end (RFC3339) on instance creation time
    StatisticsOrder:
      name: order
      in: query
      required: false
      schema:
        type: string
        enum: [date, -date]
        default: -date
        description: Runs-per-day bucket direction
    UserOrder:
      name: order
      in: query
      required: false
      schema:
        type: string
        enum: [created_at, -created_at]
        default: -created_at
        description: Creation-time direction; newest first by default
    UserIDs:
      name: id
      in: query
      required: false
      schema:
        type: array
        items: { type: string, format: uuid }
        maxItems: 100
        description: Comma-separated id filter
      style: form
      explode: false
    UserRoles:
      name: role
      in: query
      required: false
      schema:
        type: array
        items: { type: string }
        maxItems: 100
        description: Comma-separated membership filter; only local users carry stored roles
      style: form
      explode: false
    UserIssuers:
      name: issuer
      in: query
      required: false
      schema:
        type: array
        items: { type: string }
        maxItems: 100
        description: Comma-separated issuer filter ("local" for password accounts)
      style: form
      explode: false
    UserIsLocal:
      name: is_local
      in: query
      required: false
      schema: { type: boolean, description: "true: only password accounts; false: only provider and system rows; omitted: both" }
    UserEmailVerified:
      name: email_verified
      in: query
      required: false
      schema: { type: boolean, description: "true: only proven mailboxes; false: only pending ones; omitted: both" }
    UserIsActive:
      name: is_active
      in: query
      required: false
      schema: { type: boolean, description: "true: only enabled accounts; false: only disabled ones; omitted: both" }
    UserEmail:
      name: email
      in: query
      required: false
      schema: { type: string, description: Case-insensitive email substring }
    UserName:
      name: name
      in: query
      required: false
      schema: { type: string, description: Case-insensitive name substring }
    DefinitionID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    SecretKey:
      name: key
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9_]{1,128}$"
    FormID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    InstanceID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    NodeID:
      name: node_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ScheduleID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    BadRequest:
      description: Invalid query or malformed request
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: Not found
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: State or reference conflict
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: >-
        Missing or invalid credential (no API token, no valid bearer token, or
        a token naming no subject/issuer). On PUT /input, which also serves
        anonymous callers, this means a credential was presented and refused;
        sending no credential at all is anonymous and is answered 403 on a
        non-public node instead.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: >-
        Authenticated but not allowed: the caller's roles do not carry the
        endpoint permission, or the input node's gates admit neither the
        caller's user id nor any of their roles (the two gates are a union).
        A valid API token is the service principal and is never refused.
        On PUT /input an anonymous caller with no credential is also answered
        here when the waiting input node is not public.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    TooManyRequests:
      description: >-
        Rate limit exceeded: the client IP or email made too many requests
        inside the window. The response carries a Retry-After header with
        whole seconds until the block expires. The body is identical across
        endpoints and cases, so a refusal cannot be read as an
        account-existence oracle.
      headers:
        Retry-After:
          description: Whole seconds until the block expires
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    InternalError:
      description: Internal error
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unprocessable:
      description: Invalid definition or input
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    PayloadTooLarge:
      description: Request body breaching infra.http.max_body_bytes (default 1 MiB), or a multipart delivery breaching a size limit; a failed multipart delivery uploads nothing
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    UnsupportedMediaType:
      description: Delivery media type the waiting input node does not accept
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, default: "about:blank" }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string }
    AuthConfig:
      type: object
      description: The login contract, readable without a credential.
      required: [enabled, api_token_enabled, local_enabled, registration_enabled, email_verification_enabled, roles]
      properties:
        enabled:
          type: boolean
          description: True when an OIDC provider is configured and bearer tokens are accepted
        issuer:
          type: string
          description: OIDC issuer used for discovery and the iss check
        client_id:
          type: string
          description: Client id the provider has this resource server registered under
        audience:
          type: string
          description: |
            The value a token's `aud` claim must carry for this API to accept
            it. It is the verifier's audience: the configured
            `auth.oidc.audience` when set, and otherwise `client_id`. Equal
            to `client_id` means no distinct resource audience is in use.
        authorization_url:
          type: string
          description: Provider authorization endpoint the frontend starts the code+PKCE flow at
        token_url:
          type: string
          description: Provider token endpoint the frontend exchanges the code at
        roles_claim:
          type: string
          description: |
            Claim the caller's roles are read from. A dotted path reads a
            nested claim, e.g. "realm_access.roles".
        scopes:
          type: array
          items: { type: string }
          description: Scopes to request, openid first
        api_token_enabled:
          type: boolean
          description: True when the API token is configured, so a frontend can show a token login
        local_enabled:
          type: boolean
          description: True when the built-in local login (POST /v1/auth/register and POST /v1/auth/login, HS256 JWTs verified as Bearer [REDACTED] is on
        registration_enabled:
          type: boolean
          description: True when POST /v1/auth/register admits self-registration; otherwise users arrive from an admin only
        email_verification_enabled:
          type: boolean
          description: True when a registered account stays pending until its mailed link is consumed over POST /v1/auth/verify-email
        roles:
          type: array
          items: { type: string }
          description: Every role name the role catalog knows, so a role can be labelled before the caller holds one
    AuthMe:
      type: object
      description: The identity behind the presented credential.
      required: [id, name, email, roles, service, permissions]
      properties:
        id: { type: string, format: uuid, description: users.id, the audit actor for this caller }
        subject:
          type: string
          nullable: true
          description: Provider subject; null for the API-token service principal
        name: { type: string }
        email: { type: string }
        roles:
          type: array
          items: { type: string }
          description: Roles the live token asserted; empty means authenticated with no role
        service:
          type: boolean
          description: True for the API-token principal, which bypasses every authorization gate
        permissions:
          type: array
          items: { type: string }
          description: Union of the caller's role permissions; every known action for the service principal
    Role:
      type: object
      required: [name, permissions, created_at, updated_at]
      properties:
        name: { type: string }
        description:
          type: string
          nullable: true
          description: Authored over the API, or derived as "Configured role <name>" when omitted at creation
        permissions:
          type: array
          items: { type: string }
          description: Actions this role grants, as the role tables store them
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    RoleCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, description: Role name; blank is 422, a duplicate is 409 }
        description:
          type: string
          description: Omitted or blank derives "Configured role <name>"
        permissions:
          type: array
          items: { type: string }
          description: Actions the role grants, trimmed and deduped; a blank entry is 422, an omitted list grants nothing
    RoleUpdate:
      type: object
      properties:
        description:
          type: string
          description: Omitted keeps the stored description
        permissions:
          type: array
          items: { type: string }
          description: Fully replaces the grant set; an empty or omitted list revokes every grant, a blank entry is 422
    RoleList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Role" }
    User:
      type: object
      required: [id, name, email, roles, is_active, email_verified, is_local, created_at, updated_at]
      properties:
        id: { type: string, format: uuid, description: users.id, the audit actor for this user }
        subject:
          type: string
          nullable: true
          description: Provider subject; null for a user with no provider identity
        issuer:
          type: string
          nullable: true
          description: Provider issuer ("local" for a password account); null for a user with no provider identity
        name: { type: string }
        email: { type: string }
        roles:
          type: array
          items: { type: string }
          description: A local user's stored roles; empty for OIDC callers, who carry theirs on the live token
        is_active:
          type: boolean
          description: False for a disabled (soft-deleted) account
        email_verified:
          type: boolean
          description: False while a self-registered account awaits its verification link
        is_local:
          type: boolean
          description: True for a password account rather than an OIDC identity
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    UserCreate:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, description: Display name; blank is 422 }
        email: { type: string, description: Login email, stored lowercased; malformed is 422, a duplicate is 409 }
        password: { type: string, description: 6..72 characters with at least one uppercase letter, one number, and one symbol; outside is 422. Stored as a bcrypt hash, never returned }
        roles:
          type: array
          items: { type: string }
          description: Catalog roles to assign; an unknown role is 422, an omitted list assigns none
    UserUpdate:
      type: object
      properties:
        name: { type: string, description: Omitted keeps the stored name; blank is 422 }
        email: { type: string, description: Omitted keeps the stored email; a change re-pends verification while it is on }
        roles:
          type: array
          items: { type: string }
          description: Fully replaces the membership set; an empty list revokes every membership. users:write only
        password: { type: string, description: Omitted or empty keeps the credential; otherwise 6..72 characters with at least one uppercase letter, one number, and one symbol. The account itself must also send current_password }
        current_password: { type: string, description: Required when the account itself rotates its password; a mismatch is 422 }
        is_active: { type: boolean, description: users:write only }
        email_verified: { type: boolean, description: Explicit verdict, retiring any outstanding link. users:write only }
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string }
        email: { type: string }
        password: { type: string, description: 6..72 characters with at least one uppercase letter, one number, and one symbol }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }
    LoginResponse:
      type: object
      required: [access_token, token_type, expires_in, user]
      properties:
        access_token: { type: string, description: HS256 JWT for the Authorization header }
        token_type: { type: string, description: Always Bearer }
        expires_in: { type: integer, description: Whole seconds until the token expires }
        user: { $ref: "#/components/schemas/User" }
    RegisterResponse:
      type: object
      required: [user, pending_verification]
      properties:
        user: { $ref: "#/components/schemas/User" }
        access_token: { type: string, description: Present only when the account activates at once }
        token_type: { type: string, description: Always Bearer when present }
        expires_in: { type: integer, description: Whole seconds until the token expires, when present }
        pending_verification: { type: boolean, description: True when the account awaits its mailed link and no token was issued }
    VerifyEmailRequest:
      type: object
      required: [token]
      properties:
        token: { type: string, description: Raw token from the mailed link; unknown is 422, expired asks for a resend }
    ResendVerificationRequest:
      type: object
      required: [email]
      properties:
        email: { type: string }
    ResendVerificationResponse:
      type: object
      required: [message]
      properties:
        message: { type: string, description: Identical for unknown, verified, and pending emails }
    UserList:
      type: object
      required: [items, page, per_page, total, total_pages]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/User" } }
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
        total_pages: { type: integer }
    SecretRequest:
      type: object
      required: [key, value]
      properties:
        key:
          type: string
          pattern: "^[A-Za-z0-9_]{1,128}$"
        value:
          type: string
          minLength: 1
          maxLength: 8192
    UpdateSecretRequest:
      type: object
      required: [value]
      properties:
        value:
          type: string
          minLength: 1
          maxLength: 8192
    Secret:
      type: object
      required: [key, value_masked, created_at, updated_at]
      properties:
        key: { type: string }
        value_masked:
          type: string
          const: "********"
          description: Constant mask. Plaintext secret values are never returned.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SecretList:
      type: object
      required: [items, page, per_page, total, total_pages]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Secret" } }
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
        total_pages: { type: integer }
    NodeDefinitionRequest:
      type: object
      required: [name, type, content]
      properties:
        name: { type: string }
        type:
          type: string
          description: "Builtin node type (script, conditions, input, group, external_call, output, poller) or a registered custom node type (lowercase identifier, e.g. s3fetch). Custom types require type+config in content; see docs/custom-nodes.md."
          enum: [script, conditions, input, group, external_call, output, poller]
        previous_version_id: { type: string, format: uuid, nullable: true }
        content: { type: object }
    NodeDefinition:
      type: object
      required: [id, name, version, lineage_id, type, content, created_by, updated_by, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        version: { type: integer }
        previous_version_id: { type: string, format: uuid, nullable: true }
        lineage_id: { type: string, format: uuid }
        type: { type: string }
        content: { type: object }
        schema:
          type: object
          nullable: true
          description: |
            Full node-object JSON Schema (draft 2020-12) describing the accepted
            shape for this type. Null when the type is unknown to this build.
            Docs-only; Go parsers stay authoritative.
        created_by: { type: string, format: uuid }
        updated_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    NodeDefinitionList:
      type: object
      required: [items, page, per_page, total, total_pages]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/NodeDefinition" } }
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
        total_pages: { type: integer }
    NodeType:
      type: object
      required: [type, builtin, schema]
      properties:
        type: { type: string }
        builtin:
          type: boolean
          description: True for a core engine type; registered custom types carry false
        schema:
          type: object
          nullable: true
          description: |
            Full node-object JSON Schema (draft 2020-12) describing the accepted
            shape for this type. Null when a custom type registered no schema.
            Docs-only; Go parsers stay authoritative.
    NodeTypeList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/NodeType" } }
    WorkflowDefinitionRequest:
      type: object
      required: [name, content]
      properties:
        name: { type: string }
        previous_version_id: { type: string, format: uuid, nullable: true }
        content:
          type: object
          description: |
            Workflow content. Optional top-level `context_mode: full|lean`
            overrides the BEELINEWF_ENGINE_LEAN_CONTEXT_DEFAULT fleet default
            and is snapshotted onto each created instance.
    WorkflowDefinition:
      type: object
      required: [id, name, version, lineage_id, content, schemas, created_by, updated_by, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        version: { type: integer }
        previous_version_id: { type: string, format: uuid, nullable: true }
        lineage_id: { type: string, format: uuid }
        content: { type: object }
        schemas:
          type: object
          additionalProperties: { type: object }
          description: |
            Node-object JSON Schemas (draft 2020-12) keyed by type for all node
            types used in this workflow. Docs-only; Go parsers stay authoritative.
        created_by: { type: string, format: uuid }
        updated_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    WorkflowDefinitionList:
      type: object
      required: [items, page, per_page, total, total_pages]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/WorkflowDefinition" } }
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
        total_pages: { type: integer }
    CreateInstanceRequest:
      type: object
      required: [workflow_definition_id]
      properties:
        workflow_definition_id: { type: string, format: uuid }
        context: { type: object }
        debug:
          type: boolean
          description: |
            Step-through run: the instance starts paused and re-pauses
            after every node until termination. Immutable after create.
        snapshot_forms:
          type: boolean
          description: "Freeze every referenced form's schema/ui into the instance at creation. Status then serves the frozen bytes in pending_input.form; later library edits do not affect the run. Default false: status serves form_id only."
    CreateInstanceResponse:
      type: object
      required: [id, status]
      properties:
        id: { type: string, format: uuid }
        status: { type: string }
    InstanceSummary:
      type: object
      required: [id, workflow_definition_id, status, waiting_reason, pause_requested, termination_pending, debug, error, created_by, updated_by, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        workflow_definition_id: { type: string, format: uuid }
        status: { type: string, enum: [waiting, running, paused, finished, failed, stopped] }
        waiting_reason: { type: string, nullable: true }
        pause_requested: { type: boolean }
        termination_pending: { type: boolean }
        debug: { type: boolean }
        error: { type: string, nullable: true }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
        created_by: { type: string, format: uuid }
        updated_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    InstanceList:
      type: object
      required: [items, page, per_page, total, total_pages]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/InstanceSummary" } }
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
        total_pages: { type: integer }
    StatisticsSummary:
      type: object
      required: [total_runs, finished_runs, failed_runs, stopped_runs, terminal_runs, active_runs, runs_per_day]
      properties:
        total_runs: { type: integer }
        finished_runs: { type: integer }
        failed_runs: { type: integer }
        stopped_runs: { type: integer }
        terminal_runs: { type: integer }
        active_runs: { type: integer, description: waiting+running+paused instances in the same creation window }
        success_rate: { type: number, nullable: true }
        average_duration_ms: { type: number, nullable: true }
        runs_per_day: { type: array, items: { $ref: "#/components/schemas/RunsPerDay" } }
    RunsPerDay:
      type: object
      required: [date, total_runs, finished_runs, failed_runs, stopped_runs]
      properties:
        date: { type: string, description: Calendar day YYYY-MM-DD }
        total_runs: { type: integer }
        finished_runs: { type: integer }
        failed_runs: { type: integer }
        stopped_runs: { type: integer }
    InstanceStatus:
      type: object
      required: [id, workflow_definition_id, context_mode, debug, status, waiting_reason, pause_requested, termination_pending, attempt, counters, created_by, updated_by, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        workflow_definition_id: { type: string, format: uuid }
        context_mode:
          type: string
          enum: [full, lean]
          description: Snapshotted at instance create from the definition context_mode or BEELINEWF_ENGINE_LEAN_CONTEXT_DEFAULT
        debug:
          type: boolean
          description: Step-through run created with debug true; re-pauses after every node
        status: { type: string, enum: [waiting, running, paused, finished, failed, stopped] }
        waiting_reason: { type: string, nullable: true }
        pause_requested: { type: boolean }
        termination_pending: { type: boolean }
        migrated_from:
          type: string
          format: uuid
          nullable: true
          description: Source instance id when this run was created by a definition migration, else null
        superseded_by:
          type: string
          format: uuid
          nullable: true
          description: Replacement instance id after this run was migrated, else null
        current_group_id: { type: string, format: uuid, nullable: true }
        current_node_id: { type: string, format: uuid, nullable: true }
        current_node_instance_id:
          type: string
          nullable: true
          description: Public node instance id "<instance>:<occurrence>"
        attempt: { type: integer }
        counters: { type: object }
        nodes:
          type: object
          nullable: true
          description: Graph node id to occurrence state (omitted when the definition cannot be loaded)
          additionalProperties: { $ref: "#/components/schemas/NodeOccurrence" }
        pending_input:
          $ref: "#/components/schemas/PendingInput"
          nullable: true
          description: |
            Waiting-input contract (omitted unless the instance waits on an
            input node). The frontend renders pending_input.form when
            present (frozen bytes from an instance created with
            snapshot_forms), else fetches the form named by
            pending_input.form_id via GET /v1/forms/{form_id}, renders it,
            then delivers the payload. form_id is absent when the input
            node references no form.
        parallel:
          type: array
          nullable: true
          description: |
            Parallel executions in creation order with their branches
            (omitted unless the instance forked). Loops fork repeatedly;
            nested executions link to their owner branch via
            parent_branch_id. Lease internals and branch contexts are
            never exposed here.
          items: { $ref: "#/components/schemas/ParallelExecution" }
        error: { type: string, nullable: true }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
        created_by: { type: string, format: uuid }
        updated_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    NodeOccurrence:
      type: object
      required: [status, rollbackable]
      properties:
        occurrence_id:
          type: string
          format: uuid
          nullable: true
          description: Executed occurrence id for rollback (null when never ran)
        status:
          type: string
          enum: [not_started, waiting, running, finished, failed, stopped]
        attempt: { type: integer, nullable: true }
        rollbackable:
          type: boolean
          description: Advisory rollback target hint; the rollback endpoint stays the source of truth
    PendingInput:
      type: object
      required: [node_id, channel, output_property, allowed_roles, allowed_users, record_actor, public, accept]
      properties:
        node_id: { type: string, format: uuid }
        channel: { type: string }
        accept:
          type: array
          items: { type: string }
          description: |
            Request media types the node delivers. application/json is always
            a JSON body; multipart/form-data additionally admits a file
            upload. Nodes that predate the field report application/json only.
        output_property:
          type: string
          description: Bare top-level key the accepted payload is written to; empty when the node sets none, in which case the node id is used
        form_id:
          type: string
          format: uuid
          nullable: true
          description: Forms-library id the frontend fetches to render (absent when the node references no form)
        form:
          type: object
          nullable: true
          description: Frozen form bytes served when the instance was created with snapshot_forms (absent for live instances and formless nodes)
          properties:
            schema:
              type: object
              description: JSON Schema (draft 2020-12) render contract, as frozen at instance start
            ui:
              type: object
              nullable: true
              description: Opaque frontend render hints (label, order, widget), as frozen at instance start
        allowed_roles:
          type: array
          items: { type: string }
          description: |
            The node's role gate, checked against the caller's token roles.
            The two gates are a union: a listed role passes even when
            allowed_users is non-empty. Empty means no role restriction.
            Always empty on a public node, which ignores both gates.
        allowed_users:
          type: array
          items:
            type: object
            required: [id]
            properties:
              id:
                type: string
                format: uuid
                description: Users.id uuid of a caller allowed to deliver to this node.
          description: |
            The node's user gate, checked against the caller's resolved user
            id. A listed user passes however their roles read, and the two
            gates are a union: a listed role passes even when this list is
            non-empty. Empty means no user restriction. Always empty on a
            public node, which ignores both gates.
        record_actor:
          type: boolean
          description: |
            True when an accepted delivery is written as the attribution
            envelope {user_id, input_data} rather than the bare payload, so
            a frontend knows which shape the context will hold. Always false
            on a public node, which cannot attribute an anonymous caller.
        public:
          type: boolean
          description: |
            True when the node also accepts a delivery carrying no
            credential at all, so PUT /input admits an anonymous caller even
            with auth enabled. A public node ignores allowed_roles and
            allowed_users, which are reported empty here while staying
            stored on the definition; record_actor is still always false,
            and the flag only exists on input nodes. An
            anonymous delivery is written as the bare payload and marked
            delivered_by anonymous in the delivery history.
    ParallelExecution:
      type: object
      required: [id, depth, start_node_id, end_node_id, status, branch_count, completed_count, branches]
      properties:
        id: { type: string, format: uuid }
        parent_branch_id:
          type: string
          format: uuid
          nullable: true
          description: Owning branch of a nested execution (null for a top-level fork)
        depth:
          type: integer
          description: Structural nesting level (1 for a top-level fork)
        start_node_id: { type: string, format: uuid }
        end_node_id: { type: string, format: uuid }
        status:
          type: string
          enum: [waiting_for_branches, ready_to_join, completed, failed, cancelled]
        branch_count: { type: integer }
        completed_count: { type: integer }
        branches:
          type: array
          items: { $ref: "#/components/schemas/ParallelBranch" }
    ParallelBranch:
      type: object
      required: [id, name, branch_index, start_node_id, status, waiting_reason, error, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        branch_index:
          type: integer
          description: Alphabetical position among siblings; drives deterministic debug stepping and status order
        start_node_id: { type: string, format: uuid }
        status:
          type: string
          enum: [pending, running, waiting, completed, failed, cancelled]
        waiting_reason:
          type: string
          description: Park reason while waiting (input, parallel, or empty once runnable)
        error: { type: string }
        updated_at: { type: string, format: date-time }
    SaveFormRequest:
      type: object
      required: [name, schema]
      properties:
        name: { type: string }
        content_type:
          type: string
          enum: [application/json, multipart/form-data]
          description: Submission encoding the frontend must send; omitted means application/json
        schema:
          type: object
          description: |
            Non-empty JSON Schema (draft 2020-12) the frontend renders.
            A file-upload field is an array whose items are
            {type: string, format: binary}; it may carry
            allowed_mime_types (list of type/subtype or type/*) and
            max_file_bytes (positive integer) on the field itself, which
            the frontend validates File.type and File.size against. A
            text field is a string, or an array of strings when
            repeatable.
        ui:
          type: object
          nullable: true
          description: Opaque frontend render hints (label, order, widget)
    Form:
      type: object
      required: [id, name, content_type, schema, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        content_type:
          type: string
          enum: [application/json, multipart/form-data]
          description: Submission encoding the frontend must send
        schema:
          type: object
          description: |
            JSON Schema (draft 2020-12) render contract. File-upload
            fields declare allowed_mime_types and max_file_bytes on
            the field for frontend validation; see SaveFormRequest.
        ui:
          type: object
          nullable: true
          description: Opaque frontend render hints (label, order, widget)
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    FormList:
      type: object
      required: [items, page, per_page, total, total_pages]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Form" } }
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
        total_pages: { type: integer }
    FormUsage:
      type: object
      required: [form_id, workflow_definitions, node_definitions, workflow_instances, instance_total, page, per_page]
      properties:
        form_id: { type: string, format: uuid }
        workflow_definitions:
          type: array
          items: { $ref: "#/components/schemas/FormUsageWorkflowDefinition" }
        node_definitions:
          type: array
          items: { $ref: "#/components/schemas/FormUsageNodeDefinition" }
        workflow_instances:
          type: array
          items: { $ref: "#/components/schemas/FormUsageInstance" }
        instance_total: { type: integer }
        page: { type: integer }
        per_page: { type: integer }
    FormUsageWorkflowDefinition:
      type: object
      required: [id, name, version, lineage_id, nodes]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        version: { type: integer }
        lineage_id: { type: string, format: uuid }
        nodes:
          type: array
          items: { $ref: "#/components/schemas/FormUsageNode" }
    FormUsageNode:
      type: object
      required: [node_id, node_name, node_definition_id]
      properties:
        node_id: { type: string, format: uuid }
        node_name: { type: string }
        node_definition_id:
          type: string
          description: Referenced node definition id, or empty for an inline form_id
    FormUsageNodeDefinition:
      type: object
      required: [id, name, version, lineage_id, type]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        version: { type: integer }
        lineage_id: { type: string, format: uuid }
        type: { type: string }
    FormUsageInstance:
      type: object
      required: [id, workflow_definition_id, status, is_waiting_on_form]
      properties:
        id: { type: string, format: uuid }
        workflow_definition_id: { type: string, format: uuid }
        status: { type: string }
        is_waiting_on_form:
          type: boolean
          description: True when the instance is parked on an input node that uses the form
        current_node_id: { type: string, format: uuid, nullable: true }
    InstanceContext:
      type: object
      required: [id, context]
      properties:
        id: { type: string, format: uuid }
        context: { type: object }
    InputDeliveryResponse:
      type: object
      required: [accepted]
      properties:
        accepted: { type: boolean }
        error: { type: string, nullable: true }
    PauseResponse:
      type: object
      required: [status, pause_requested]
      properties:
        status: { type: string }
        pause_requested: { type: boolean }
    ResumeResponse:
      type: object
      required: [status]
      properties:
        status: { type: string }
    StopResponse:
      type: object
      required: [status, termination_pending]
      properties:
        status: { type: string }
        termination_pending: { type: boolean }
    RollbackRequest:
      type: object
      required: [target_occurrence_id]
      properties:
        target_occurrence_id:
          type: string
          format: uuid
          description: Already-executed node occurrence id (from the node debug API)
        reason:
          type: string
          description: Optional audit annotation recorded on the rollback event only
    RollbackResponse:
      type: object
      required: [status, current_node_id]
      properties:
        status: { type: string, enum: [paused] }
        current_node_id: { type: string, format: uuid }
    MigrateRequest:
      type: object
      required: [workflow_definition_id, start_node_id]
      properties:
        workflow_definition_id:
          type: string
          format: uuid
          description: Target definition id; must share the source lineage at a higher version
        start_node_id:
          type: string
          format: uuid
          description: Node in the target graph to start from; must not sit strictly inside a parallel region
        context_patch:
          type: object
          description: Deep-merged over the carried source context (arrays replaced); fresh env/secret snapshots still win
        start_paused:
          type: boolean
          default: true
          description: Park the replacement paused for inspect-fix-resume
        reason:
          type: string
          description: Optional audit annotation recorded on both sides' events
    MigrateInstance:
      type: object
      required: [id, workflow_definition_id, status, waiting_reason, current_node_id, migrated_from, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        workflow_definition_id: { type: string, format: uuid }
        status: { type: string }
        waiting_reason: { type: string, nullable: true }
        current_node_id: { type: string, format: uuid, nullable: true }
        migrated_from: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    MigrateResponse:
      type: object
      required: [instance, source_instance_id, source_status]
      properties:
        instance: { $ref: "#/components/schemas/MigrateInstance" }
        source_instance_id: { type: string, format: uuid }
        source_status: { type: string, enum: [stopped] }
    NodeDebug:
      type: object
      required:
        - occurrence_id
        - source_node_definition_id
        - name
        - type
        - selected_attempt
        - latest_attempt
        - attempt_count
        - status
      properties:
        occurrence_id: { type: string, format: uuid }
        source_node_definition_id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string }
        selected_attempt: { type: integer, nullable: true }
        latest_attempt: { type: integer, nullable: true }
        attempt_count: { type: integer }
        status:
          type: string
          enum: [not_started, waiting, running, finished, failed, stopped]
        context_before: { type: object, nullable: true }
        context_after: { type: object, nullable: true }
        input: {}
        output: {}
        error: { type: string, nullable: true }
        recovery_policy: { type: string, nullable: true }
        recovery_result: { type: string, nullable: true }
        cancelled: { type: boolean }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
        stopped_at: { type: string, format: date-time, nullable: true }
        duration_ms: { type: integer, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    DebugContext:
      type: object
      required:
        - instance_id
        - node_id
        - occurrence_id
        - attempt
        - is_debug_paused
        - typescript
      properties:
        instance_id: { type: string, format: uuid }
        node_id:
          type: string
          description: Resolved graph node id (empty when the debug cursor is empty)
        occurrence_id: { type: string, format: uuid, nullable: true }
        attempt: { type: integer, nullable: true }
        is_debug_paused: { type: boolean }
        typescript:
          type: string
          description: Inline structural `declare const context` declaration for Monaco autocomplete; never carries literal values
    CronScheduleRequest:
      type: object
      required: [workflow_definition_id, crontab]
      properties:
        workflow_definition_id: { type: string, format: uuid }
        crontab:
          type: string
          description: |
            Standard 5-field cron expression (minute first) or an @descriptor
            (@yearly, @monthly, @weekly, @daily, @midnight, @hourly,
            @every <duration>). No seconds field. An inline TZ=/CRON_TZ=
            prefix wins over timezone.
        timezone:
          type: string
          default: UTC
          description: IANA timezone ticks are evaluated in; empty defaults to UTC
        context:
          type: object
          description: JSON object new instances start from; empty normalizes to {}
        enabled:
          type: boolean
          default: true
          description: Omitted schedules start enabled
    CronSchedule:
      type: object
      required: [id, workflow_definition_id, crontab, timezone, context, enabled, created_by, updated_by, created_at, updated_at]
      properties:
