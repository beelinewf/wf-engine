name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write # create GitHub Release
  packages: write # push image to GHCR

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16@sha256:65b16a8b326e0cfbdf33fa7e783f2a0cb352a61448616ccccfd616ef42aa0f65
        env:
          POSTGRES_USER: gorm
          POSTGRES_PASSWORD: gorm
          POSTGRES_DB: gorm
        ports:
          - 9921:5432
        options: >-
          --health-cmd "pg_isready -U gorm -d gorm"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      # dbname is credentials-only and ignored: internal/workflow/testdb
      # auto-provisions one scratch database per suite from this DSN.
      TEST_DATABASE_DSN: host=localhost user=gorm password=gorm dbname=gorm port=9921 sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: go test
        run: go test ./... -count=1
      - name: go test -race
        run: go test -race ./... -count=1

  release:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # git-cliff needs full history
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4
        id: cliff
        with:
          args: --latest --strip all
        env:
          OUTPUT: /tmp/NOTES.md
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body_path: /tmp/NOTES.md

  cleanup-tag:
    runs-on: ubuntu-latest
    needs: test
    if: failure()
    permissions:
      contents: write # delete the pushed tag when tests fail
    steps:
      - name: Delete tag on test failure
        run: gh api -X DELETE repos/${{ github.repository }}/git/refs/tags/${{ github.ref_name }} --silent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
