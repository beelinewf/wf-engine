# BeelineWF developer task runner (go-task: https://taskfile.dev).
# Usage: task build, task test, task migrate-up, ...

version: "3"

vars:
  DSN: 'host=localhost user=gorm password=gorm dbname=gorm port=9921 sslmode=disable'
  # Atlas needs a driver-qualified URL (postgres://); the bare host=... DSN is pgx-only.
  ATLAS_DEV_URL: 'postgres://gorm:gorm@localhost:9921/gorm?sslmode=disable'
  TEST_DSN: '{{.DSN}}'
  # Pinned formatter (gofumpt is a gofmt superset). Keep the version in
  # sync with the CI format step and the validation blocks in
  # README/CONTRIBUTING.
  GOFUMPT: 'go run mvdan.cc/gofumpt@v0.12.0'

tasks:
  build:
    desc: Build the app binary
    cmds:
      - go build ./...

  run:
    desc: Run the app against config.yaml
    cmds:
      - go run ./cmd/app -config config.yaml

  test:
    desc: Run the full test suite (needs PostgreSQL on :9921; single DSN auto-provisions suite DBs, or run go test -short ./... with no DB)
    cmds:
      - TEST_DATABASE_DSN='{{.TEST_DSN}}' go test ./... -count=1

  test-race:
    desc: Run the full suite under the race detector (same DB setup as test)
    cmds:
      - TEST_DATABASE_DSN='{{.TEST_DSN}}' go test -race ./... -count=1

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./...

  fmt:
    desc: Format Go sources (gofumpt)
    cmds:
      - '{{.GOFUMPT}} -w .'

  swagger:
    desc: Generate Swaggo documentation
    cmds:
      - go run github.com/swaggo/swag/cmd/swag@v1.16.6 init --generalInfo cmd/app/main.go --output docs --parseDependency --parseInternal

  migrate-up:
    desc: Apply Atlas migrations to the dev database
    cmds:
      - atlas migrate apply --config file://migrations/atlas.hcl --env gorm --var dev_url='{{.ATLAS_DEV_URL}}'

  migrate-diff:
    desc: Generate a new Atlas migration from the GORM models
    cmds:
      - atlas migrate diff add_ --config file://migrations/atlas.hcl --env gorm --var dev_url='{{.ATLAS_DEV_URL}}'

  migrate-lint:
    desc: Validate the migration directory (checksums + replay); lint is Pro-only in atlas >= v0.38
    cmds:
      - atlas migrate validate --config file://migrations/atlas.hcl --env gorm --var dev_url='{{.ATLAS_DEV_URL}}'

  e2e:
    desc: Black-box API checks against a running app
    cmds:
      - bash scripts/e2e.sh

  # Stands the app up against config.e2e-oidc.yaml (throwaway mock provider,
  # API token on), then drives the OIDC + RBAC + input-gate + attribution flow
  # black-box. The mock provider is started first because the app performs
  # discovery at boot; the script detects it is already listening and reuses
  # it rather than binding the port twice.
  #
  # The target is self-contained: it creates the throwaway database and
  # applies the migrations, so it does not depend on a developer having run
  # `task migrate-up` against the shared `gorm` database first. The app
  # never migrates, and a test that silently ran against a half-migrated
  # database would report a schema error as an auth failure.
  e2e-oidc:
    desc: Black-box OIDC/RBAC checks against a locally started app
    cmds:
      - |
        set -euo pipefail
        . scripts/e2e-bootstrap.sh
        # The single source for the service credential: the app reads it
        # through auth.api_token's BEELINEWF_API_TOKEN binding, and the script
        # reads the same variable. config.e2e-oidc.yaml deliberately leaves
        # the key out.
        export BEELINEWF_API_TOKEN="e2e-service-token"
        # Same single-source pattern for the mandatory at-rest key
        # (test-only value: base64 of bytes 0..31).
        export BEELINEWF_SECRET_ENCRYPTION_KEY="AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8="
        # Throwaway database for this run. Recreating it keeps a previous
        # run's definitions and instances from changing what the checks see.
        e2e_provision_db beelinewf_e2e
        python3 scripts/mock_oidc_provider.py http://127.0.0.1:9099 &
        mock_pid=$!
        trap 'kill $mock_pid 2>/dev/null || true' EXIT
        e2e_wait_http http://127.0.0.1:9099/.well-known/openid-configuration 50 0.2
        go run ./cmd/app -config config.e2e-oidc.yaml &
        app_pid=$!
        trap 'kill $app_pid $mock_pid 2>/dev/null || true' EXIT
        e2e_wait_http http://127.0.0.1:9999/health/live 60 1
        bash scripts/e2e-oidc.sh http://127.0.0.1:9999 http://127.0.0.1:9099

  # Self-contained plain black-box suite: throwaway database, Atlas
  # migrations, a freshly built binary on config.e2e.yaml, then
  # scripts/e2e.sh against it. Unlike `task e2e` (which expects an already
  # running app, e.g. `task run` or compose), this task owns the whole
  # lifecycle, so CI and local runs execute identical commands.
  e2e-full:
    desc: Self-contained plain e2e (throwaway DB, migrate, built binary, scripts/e2e.sh)
    cmds:
      - |
        set -euo pipefail
        . scripts/e2e-bootstrap.sh
        # Mandatory at-rest key (test-only value: base64 of bytes 0..31);
        # config.e2e.yaml deliberately leaves it out like the API token.
        export BEELINEWF_SECRET_ENCRYPTION_KEY="AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8="
        e2e_provision_db beelinewf_e2e_plain
        WORK_DIR=$(mktemp -d)
        trap 'rm -rf "$WORK_DIR"' EXIT
        go build -o "$WORK_DIR/beelinewf-e2e" ./cmd/app
        "$WORK_DIR/beelinewf-e2e" -config config.e2e.yaml &
        # No $!/kill: task's embedded shell expands $! to a job id (g1) and
        # lacks the kill builtin, so match this run's unique binary path.
        trap 'pkill -f "$WORK_DIR/beelinewf-e2e" 2>/dev/null || true; rm -rf "$WORK_DIR"' EXIT
        e2e_wait_http http://127.0.0.1:9999/health/ready 60 1
        bash scripts/e2e.sh http://127.0.0.1:9999
