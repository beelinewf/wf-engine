# BeelineWF workflow engine configuration.
#
# The app reads this file when it exists in the working directory (or when
# started with -config). Without a config file, the same keys are read from
# environment variables prefixed BEELINEWF_ (e.g. BEELINEWF_INFRA_POSTGRESQL_DSN).
# Redis and RabbitMQ are optional: leave their DSNs empty for HTTP-only
# operation. A configured but unreachable broker fails startup.

infra:
  http:
    host: "localhost:9999"
    swagger_enabled: true
    # Prometheus exposition at GET /metrics on the same port.
    # Operator override: BEELINEWF_INFRA_HTTP_METRICS_ENABLED.
    # false leaves no route (404).
    metrics_enabled: true
    # Cap on the JSON request bodies the instance handler reads (context
    # replace, input delivery); a breach answers 413. File uploads ride the
    # multipart path with its own engine.multipart limits.
    # Operator override: BEELINEWF_INFRA_HTTP_MAX_BODY_BYTES.
    max_body_bytes: 1048576
    # Server timeouts (Go duration strings). read_header_timeout bounds
    # the wait for request headers, closing slow-header connections;
    # idle_timeout reaps idle keep-alive connections. There is
    # deliberately no write timeout: one would cut long-lived SSE
    # streams. Operator overrides:
    # BEELINEWF_INFRA_HTTP_READ_HEADER_TIMEOUT,
    # BEELINEWF_INFRA_HTTP_IDLE_TIMEOUT.
    read_header_timeout: 10s
    idle_timeout: 60s
    # Cross-origin access for browser frontends deployed on another
    # origin. The default "*" allows any origin, which suits development;
    # for production, list the frontend origins (scheme://host[:port]) or
    # set an empty list to emit no Access-Control-* headers at all (only
    # the file can express empty: a set-but-empty env value falls back to
    # the default). allow_credentials requires explicit origins, never
    # "*". Operator overrides:
    # BEELINEWF_INFRA_HTTP_CORS_ALLOWED_ORIGINS (comma-separated),
    # BEELINEWF_INFRA_HTTP_CORS_ALLOWED_METHODS,
    # BEELINEWF_INFRA_HTTP_CORS_ALLOWED_HEADERS,
    # BEELINEWF_INFRA_HTTP_CORS_EXPOSED_HEADERS,
    # BEELINEWF_INFRA_HTTP_CORS_ALLOW_CREDENTIALS,
    # BEELINEWF_INFRA_HTTP_CORS_MAX_AGE (Go duration string).
    cors:
      allowed_origins: ["*"]
      allowed_methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
      allowed_headers: ["Authorization", "Content-Type", "X-Api-Token"]
      exposed_headers: []
      allow_credentials: false
      max_age: 12h
  postgresql:
    dsn: "host=localhost user=gorm password=gorm dbname=gorm port=9921 sslmode=disable TimeZone=Asia/Jakarta"
    # Pool ceiling (per replica). Size max_open_conns ≈ (engine workers ×
    # peak queries per transition) + headroom, divided across expected
    # replicas. Exhaustion degrades to latency, not errors (database/sql
    # queues for a free connection), and GORM holds a connection only per
    # query — so the 25 default trades tail latency for Postgres safety
    # under replica growth. Operator overrides:
    # BEELINEWF_INFRA_POSTGRESQL_MAX_OPEN_CONNS,
    # BEELINEWF_INFRA_POSTGRESQL_MAX_IDLE_CONNS,
    # BEELINEWF_INFRA_POSTGRESQL_CONN_MAX_LIFETIME,
    # BEELINEWF_INFRA_POSTGRESQL_CONN_MAX_IDLE_TIME,
    # BEELINEWF_INFRA_POSTGRESQL_CONNECT_TIMEOUT.
    max_open_conns: 25
    max_idle_conns: 25
    conn_max_lifetime: 5m
    conn_max_idle_time: 5m
    # Startup ping budget. A DSN that accepts TCP but never answers (a
    # blackhole host) fails the boot after this instead of hanging it.
    connect_timeout: 15s
  # Optional Redis (pub/sub input, output, and status channels). Set the DSN
  # (e.g. redis://localhost:6379/0) to enable.
  redis:
    dsn: ""
  # Optional RabbitMQ (durable input/output/status queues). Set the DSN
  # (e.g. amqp://beelinewf:beelinewf@localhost:5672/) to enable; the queue names
  # default to the values below.
  rabbitmq:
    dsn: ""
    input_queue: "beelinewf.input"
    output_queue: "beelinewf.output"
    status_queue: "beelinewf.status"
  # Optional S3-compatible object storage backing multipart input uploads.
  # Input nodes name only a bucket, an optional prefix, and optional file
  # constraints; the connection lives here so definitions never carry
  # endpoints or credentials. Leave endpoint and both keys empty to disable
  # (definitions still parse; a multipart delivery then fails at delivery
  # time). A partial configuration fails startup.
  # Operator overrides: BEELINEWF_INFRA_STORAGE_ENDPOINT,
  # BEELINEWF_INFRA_STORAGE_REGION, BEELINEWF_INFRA_STORAGE_USE_SSL,
  # BEELINEWF_INFRA_STORAGE_ACCESS_KEY, BEELINEWF_INFRA_STORAGE_SECRET_KEY.
  storage:
    endpoint: ""
    region: "us-east-1"
    use_ssl: true
    access_key: ""
    secret_key: ""

# github.com/panjf2000/ants/v2 worker pools: pool drives engine node
# transitions, status_pool drives status-update delivery. ants internals
# stay on library defaults by design.
worker:
  pool:
    size: 100
  status_pool:
    size: 20

# Cron scheduler firing loop. Every enabled replica fires the same ticks,
# but the fire claim keeps each tick to one instance; disable on replicas
# that should serve API only. refresh_interval is how often each replica
# reloads the enabled schedules, bounding how long a mutation made on one
# replica takes to reach the others.
scheduler:
  enabled: true
  refresh_interval: 30s

# Engine limits. Node timeouts are parsed as Go duration strings; scripts and
# external calls default to default_node_timeout and are capped by
# max_node_timeout. Condition evaluation and input validation always run at
# condition_timeout. Set http_allowlist to "*" to allow any target (dev only;
# the engine logs a warning).
engine:
  default_node_timeout: 30s
  max_node_timeout: 5m
  condition_timeout: 5s
  max_per_node_executions: 100
  max_total_executions: 1000
  lease_duration: 30s
  claim_batch_size: 10
  # Claim-loop pacing shared by both dispatchers; heartbeat_interval paces
  # the engine dispatcher's lease-renewal loop (the status dispatcher has
  # no heartbeat loop).
  poll_interval: 200ms
  heartbeat_interval: 5s
  max_output_bytes: 1048576
  max_redirects: 5
  # Outbound HTTP bulkhead: process-wide caps shared by external_call
  # nodes, HTTP pollers, the status publisher, and custom nodes. Fleet
  # math: 10 replicas x 16/host = 160 concurrent calls per host
  # fleet-wide; the global cap backstops the default pools. Both must
  # be > 0.
  # Operator overrides: BEELINEWF_ENGINE_HTTP_MAX_IN_FLIGHT,
  # BEELINEWF_ENGINE_HTTP_MAX_IN_FLIGHT_PER_HOST.
  http_max_in_flight: 128
  http_max_in_flight_per_host: 16
  # Operator overrides: BEELINEWF_ENGINE_LEAN_CONTEXT_DEFAULT,
  # BEELINEWF_ENGINE_LEAN_ANCHOR_EVERY, BEELINEWF_ENGINE_LEAN_REPLAY_MAX.
  lean_context_default: false
  lean_anchor_every: 20
  lean_replay_max: 500
  parallel:
    max_depth: 4
    max_branches_per_parallel: 32
    max_active_branches_per_instance: 128
  # Broker input consumer supervision. A consumer that dies is retried with
  # doubling backoff (initial_backoff..max_backoff, plus jitter) up to
  # max_attempts consecutive failures, then marked down until restart while
  # /ready reports 503. An attempt living past min_healthy_run resets the
  # count, so slow flapping never exhausts the budget. max_attempts: 1
  # restores run-once behavior (any blip parks the pod until restart).
  # Operator overrides: BEELINEWF_ENGINE_CONSUMER_RETRY_MAX_ATTEMPTS,
  # BEELINEWF_ENGINE_CONSUMER_RETRY_INITIAL_BACKOFF,
  # BEELINEWF_ENGINE_CONSUMER_RETRY_MAX_BACKOFF,
  # BEELINEWF_ENGINE_CONSUMER_RETRY_MIN_HEALTHY_RUN.
  consumer_retry:
    max_attempts: 3
    initial_backoff: 1s
    max_backoff: 30s
    min_healthy_run: 30s
  # Streaming multipart input upload limits. Every breach fails the delivery
  # and deletes the objects the request already uploaded. max_file_bytes is
  # the per-file cap only when the input node sets no max_file_bytes of its
  # own; the node value wins when present.
  # Operator overrides: BEELINEWF_ENGINE_MULTIPART_MAX_FILES,
  # BEELINEWF_ENGINE_MULTIPART_MAX_TOTAL_BYTES,
  # BEELINEWF_ENGINE_MULTIPART_MAX_FILE_BYTES,
  # BEELINEWF_ENGINE_MULTIPART_MAX_TEXT_BYTES.
  multipart:
    max_files: 20
    max_total_bytes: 134217728
    max_file_bytes: 33554432
    max_text_bytes: 1048576
  http_allowlist:
    - "127.0.0.1:8080"
    - "api.example.com"
    - "jsonplaceholder.typicode.com"
    - "openrouter.ai"
  # exec_allowlist entries must be absolute paths (verified to exist in the
  # alpine:3.20 runtime image); bare names fail startup. Each entry exposes
  # that binary's full CLI, so prefer wrapper scripts for powerful binaries.
  # Note: on busybox-based images every applet resolves to /bin/busybox, so
  # one entry covers all applets.
  exec_allowlist:
    - "/bin/echo"
    - "/bin/ls"
  # Workflow-mail relay serving smtp external_call nodes. This relay is
  # distinct from auth.local.smtp, which delivers verification mail only
  # when local auth and email verification are both enabled. An empty host
  # disables workflow mail: definitions still parse, but a send fails at
  # execution time. A host of "log" selects the dev/e2e sender that logs
  # recipients and subject instead of sending. Point host/port at an
  # authenticated internal relay with use_tls true to send for real; pass
  # the password via BEELINEWF_ENGINE_SMTP_PASSWORD, never in this file.
  # template_dir roots local smtp file bodies (a file path that is not
  # s3:// resolves under it; empty disables local files) and must name an
  # existing directory at boot. s3:// bodies read through the global
  # object store, so they additionally need infra.storage configured.
  # Equivalent env vars: BEELINEWF_ENGINE_SMTP_HOST,
  # BEELINEWF_ENGINE_SMTP_PORT, BEELINEWF_ENGINE_SMTP_USERNAME,
  # BEELINEWF_ENGINE_SMTP_PASSWORD, BEELINEWF_ENGINE_SMTP_FROM,
  # BEELINEWF_ENGINE_SMTP_USE_TLS, BEELINEWF_ENGINE_SMTP_TEMPLATE_DIR.
  smtp:
    host: ""
    port: 587
    username: ""
    password: ""
    from: ""
    use_tls: true
    template_dir: ""
  # Env snapshot deny list. At instance creation, BEELINEWF_* process env is
  # snapshotted into the instance context under the reserved env root, and
  # these patterns are the credentials that never enter a workflow template:
  # BEELINEWF_API_TOKEN, BEELINEWF_AUTH_*, BEELINEWF_SYSTEM_*, BEELINEWF_INFRA_*,
  # BEELINEWF_ENGINE_SMTP_PASSWORD, and any BEELINEWF_*_DSN (PostgreSQL,
  # Redis, RabbitMQ). A denied name is dropped from the snapshot and
  # {{ env.<denied> }} resolves as "path not found".
  #
  # Operator overrides: BEELINEWF_ENGINE_ENV_DENY_EXTRA,
  # BEELINEWF_ENGINE_ENV_ALLOW_EXCEPTIONS (comma-separated globs). These only
  # extend or narrow the hardcoded defaults, never replace them; an invalid
  # glob fails startup.
  env_deny_extra: []
  env_allow_exceptions: []

# Authentication.
#
# Two credentials are accepted, and they are independent:
#
#   * X-Api-Token authenticates the service principal. It bypasses every
#     authorization gate, so treat it as a machine credential. The broker
#     input consumers act as the same principal because they carry no JWT.
#   * OIDC bearer tokens authenticate a human. The engine is a stateless
#     resource server: the frontend runs code+PKCE against the provider and
#     calls the API with the resulting JWT. There is no callback and no
#     session on this side.
#
# With auth.enabled false and oidc.enabled false, /v1 stays open exactly as
# before this section existed.
auth:
  enabled: false
  api_token: ""

  # API-token failure throttle (F7). Failed X-Api-Token presentations are
  # counted per client IP: after max_attempts within window, further
  # attempts from that IP answer 429 with a Retry-After header for
  # block_duration. Successes never count, and OIDC Bearer [REDACTED]
  # never count (they are signed, not guessable), so legitimate callers
  # are unaffected. On by default; with auth disabled the middleware
  # never runs and these keys are inert.
  #
  # The throttle is per-replica in-memory state: each replica counts on
  # its own, so add a proxy-level throttle as well when replicas sit
  # behind one. trusted_proxies lists the IPs or CIDRs whose
  # X-Forwarded-For / X-Real-Ip headers may identify the client; empty
  # trusts no proxy and keys by the direct peer, so a spoofed header
  # can never rotate the attacker's identity. List the reverse proxy
  # here when one terminates client connections.
  #
  # Equivalent env vars: BEELINEWF_AUTH_RATE_LIMIT_ENABLED,
  # BEELINEWF_AUTH_RATE_LIMIT_MAX_ATTEMPTS, BEELINEWF_AUTH_RATE_LIMIT_WINDOW,
  # BEELINEWF_AUTH_RATE_LIMIT_BLOCK_DURATION,
  # BEELINEWF_AUTH_RATE_LIMIT_TRUSTED_PROXIES (comma-separated).
  rate_limit:
    enabled: true
    max_attempts: 20
    window: 1m
    block_duration: 1m
    trusted_proxies: []

  # OIDC resource-server settings. Any compliant provider works; the
  # frontend reads the login contract (issuer, client_id, endpoints, roles
  # claim) from GET /v1/auth/config, so nothing here is provider-specific.
  oidc:
    enabled: false
    issuer: "https://issuer.example.com"
    # The aud claim a token must carry for this API to accept it. Empty
    # falls back to client_id, which is the usual case for a single
    # resource server; set it only when the provider issues a distinct
    # resource audience. GET /v1/auth/config reports the effective value in
    # "audience" so a frontend does not have to know the fallback.
    client_id: "beelinewf"
    audience: ""
    # Claim carrying the caller's roles. Accepts an array of strings, a
    # single string, or a space-delimited string.
    roles_claim: "roles"
    # Claim used as the display name; falls back to preferred_username and
    # then email when the named claim is absent.
    username_claim: "name"
    # Tolerance for clock drift on a token's exp. A token that expired less
    # than clock_skew ago is retried against a widened window, and only
    # then: a skew never relaxes the signature, issuer, or audience
    # checks. It does not cover nbf, so a token issued ahead of this
    # clock is still rejected.
    clock_skew: 1m
    # How long a fetched JWKS stays fresh before the next verification
    # re-reads it. This is the bound on provider traffic, not just a
    # freshness hint: a rejected token never forces its own fetch, so a
    # flood of bad tokens costs one JWKS read per window rather than one
    # each. Raising it means a rotated key takes longer to take effect;
    # lowering it below 1m is clamped, because re-reading more often is the
    # provider-amplification problem the bound exists to prevent.
    cache_ttl: 5m
    # Startup discovery budget. A provider that answers too slowly fails
    # the boot after this instead of hanging it.
    discovery_timeout: 10s

  # Built-in local user authentication for customers without an external
  # provider: register/login over POST /v1/auth/register|login and HS256
  # JWTs verified as Bearer [REDACTED] No sessions and no callback; a verified
  # JWT authenticates exactly like an OIDC one. Like OIDC, local auth is
  # forced off while auth.enabled is false.
  #
  # Equivalent env vars: BEELINEWF_AUTH_LOCAL_ENABLED,
  # BEELINEWF_AUTH_LOCAL_JWT_SECRET, BEELINEWF_AUTH_LOCAL_TOKEN_TTL,
  # BEELINEWF_AUTH_LOCAL_ISSUER, BEELINEWF_AUTH_LOCAL_CLIENT_ID,
  # BEELINEWF_AUTH_LOCAL_ALLOW_REGISTRATION,
  # BEELINEWF_AUTH_LOCAL_DEFAULT_ROLE,
  # BEELINEWF_AUTH_LOCAL_PUBLIC_BASE_URL,
  # BEELINEWF_AUTH_LOCAL_EMAIL_VERIFICATION_ENABLED,
  # BEELINEWF_AUTH_LOCAL_EMAIL_VERIFICATION_TOKEN_TTL,
  # BEELINEWF_AUTH_LOCAL_EMAIL_VERIFICATION_RESEND_COOLDOWN,
  # BEELINEWF_AUTH_LOCAL_SMTP_HOST, BEELINEWF_AUTH_LOCAL_SMTP_PORT,
  # BEELINEWF_AUTH_LOCAL_SMTP_USERNAME, BEELINEWF_AUTH_LOCAL_SMTP_PASSWORD,
  # BEELINEWF_AUTH_LOCAL_SMTP_FROM, BEELINEWF_AUTH_LOCAL_SMTP_USE_TLS,
  # BEELINEWF_AUTH_LOCAL_RATE_LIMIT_ENABLED,
  # BEELINEWF_AUTH_LOCAL_RATE_LIMIT_MAX_ATTEMPTS,
  # BEELINEWF_AUTH_LOCAL_RATE_LIMIT_WINDOW,
  # BEELINEWF_AUTH_LOCAL_RATE_LIMIT_BLOCK_DURATION.
  local:
    enabled: false
    # Dedicated HMAC secret signing local JWTs (at least 32 bytes).
    # Never reuse the API token or the at-rest encryption key: every
    # replica must run with the same secret, or tokens minted on one
    # replica are rejected by the others.
    jwt_secret: ""
    token_ttl: 24h
    issuer: "beelinewf-local"
    client_id: "beelinewf"
    # Self-registration switch. Closed (false) means users are created by
    # an admin over POST /v1/users; open (true) also admits POST
    # /v1/auth/register, assigning default_role (empty assigns no roles).
    allow_registration: false
    default_role: ""
    # Frontend origin used to build the email verification link
    # ({base}/verify-email?token=...). Required only when email
    # verification is enabled.
    public_base_url: ""
    # Toggled email verification. Off (false) activates a registered
    # account immediately; on (true) the account stays pending until the
    # mailed token is consumed over POST /v1/auth/verify-email, and login
    # is refused until then. Enabling it requires public_base_url and the
    # smtp settings below (host "log" selects the dev sender that logs
    # the link instead of sending it).
    email_verification:
      enabled: false
      token_ttl: 24h
      resend_cooldown: 60s
    smtp:
      host: ""
      port: 587
      username: ""
      password: ""
      from: ""
      use_tls: true
      # Optional override for the embedded verification-mail templates:
      # a directory holding verify_email.html and verify_email.txt with
      # .Link and .ExpiresIn data. Empty keeps the embedded defaults.
      template_dir: ""
    # Throttle for the four public local-auth endpoints (register, login,
    # resend-verification, verify-email), per client IP and per email.
    # Per-replica in-memory state like the API-token throttle above, so
    # add a proxy-level throttle as well when replicas sit behind one.
    # The client IP is the direct peer unless auth.rate_limit lists the
    # proxy in trusted_proxies.
    rate_limit:
      enabled: true
      max_attempts: 10
      window: 1m
      block_duration: 5m

  # Equivalent env var: BEELINEWF_AUTH_ROLE_PERMISSIONS (JSON object). A set
  # value overrides this file section; blank falls back to it.
  # First-boot seed for the role tables: role name to the resource-actions it
  # grants. It applies only while the roles table is empty; once seeded, the
  # database is the source of truth and roles are managed over the API
  # (POST/PUT/DELETE /v1/roles, gated on roles:write). A role the token
  # carries that is absent from the catalog grants nothing, so an unknown
  # role denies by default.
  #
  # Actions: definitions:read, definitions:write, secrets:read,
  # secrets:write, forms:read, forms:write, instances:create,
  # instances:read, instances:update-context, input:deliver,
  # instances:control, instances:migrate, statistics:read, roles:read,
  # roles:write, schedules:read, schedules:write, users:read, users:write.
  role_permissions:
    admin:
      - "definitions:read"
      - "definitions:write"
      - "secrets:read"
      - "secrets:write"
      - "forms:read"
      - "forms:write"
      - "instances:create"
      - "instances:read"
      - "instances:update-context"
      - "input:deliver"
      - "instances:control"
      - "instances:migrate"
      - "statistics:read"
      - "roles:read"
      - "roles:write"
      - "schedules:read"
      - "schedules:write"
      - "users:read"
      - "users:write"
    finance:
      - "instances:read"
      - "input:deliver"
    auditor:
      - "definitions:read"
      - "instances:read"
      - "statistics:read"
      - "roles:read"

# The configured system user is the audit actor for engine and service
# side effects.
# Secret at-rest encryption. The key seals secret values in the database
# (secrets table and the secret root of persisted workflow contexts). It is
# mandatory with no default: the app refuses to boot without it. Supply it
# through BEELINEWF_SECRET_ENCRYPTION_KEY (base64 of 32 bytes,
# `openssl rand -base64 32`); the empty value below only documents the key.
secrets:
  encryption_key: ""

system:
  user_id: "00000000-0000-7000-8000-000000000001"
  name: "system"
  email: "system@localhost.local"
